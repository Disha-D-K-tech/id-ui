<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Livision DataHub — Approval Review</title>
  <link rel="icon" type="image/x-icon" href="ld.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --lv-purple-1: #b29cff;
      --lv-purple-2: #7c63ff;
      --lv-indigo: #5b3ed6;
      --muted: #6b6b80;
      --glass: rgba(255,255,255,0.86);
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
    }
    body {
      background: radial-gradient(1000px 400px at 10% 10%, rgba(123,97,255,0.06), transparent),
                  linear-gradient(120deg, #eef0ff, #fbf8ff);
      color: #172033;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }
    .top {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 26px;
      background: linear-gradient(90deg, rgba(255,255,255,0.92), rgba(250,246,255,0.92));
      border-bottom: 1px solid rgba(120,110,220,0.06);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(6px);
    }
    .top .logo {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--lv-purple-1), var(--lv-indigo));
      display: grid; place-items: center;
      color: white; font-weight: 700;
      text-decoration: none;
    }
    .top .brand .title { font-size: 18px; font-weight: 800; color: var(--lv-indigo); }
    .top .brand .sub   { font-size: 13px; color: var(--muted); }
    .main { padding: 28px 40px 100px; max-width: 1200px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; background: var(--glass); padding: 12px 18px;
      border-radius: 12px; border: 1px solid rgba(120,110,220,0.06);
      margin-bottom: 20px;
    }
    .topbar .title { font-size: 18px; font-weight: 700; color: var(--lv-indigo); }
    .topbar .sub   { font-size: 13px; color: var(--muted); }
    .page-card {
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(120,110,220,0.08);
      border-radius: 18px; padding: 26px;
      box-shadow: 0 18px 40px rgba(91,62,214,0.05);
      margin-bottom: 24px;
    }
    .page-card h5 {
      font-weight: 800; color: var(--lv-indigo);
      margin-bottom: 16px; font-size: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    .schema-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 999px;
      background: #eef2ff; color: #4338ca;
      border: 1px solid #c7d2fe;
      font-size: 12px; font-weight: 700;
      margin-bottom: 16px;
    }
    .status-panel {
      padding: 14px 16px; border-radius: 14px;
      background: linear-gradient(90deg, rgba(124,99,255,0.08), rgba(255,154,177,0.08));
      color: #334155; font-weight: 600; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .binary-table {
      width: 100%; border-collapse: collapse;
      background: white; font-size: 13px; text-align: left;
    }
    .binary-table thead {
      background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: #334155;
    }
    .binary-table th { padding: 12px 16px; font-weight: 700; }
    .binary-table td { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; }
    .binary-table td:first-child { font-weight: 600; color: var(--lv-indigo); }
    .badge-green {
      display: inline-flex; padding: 3px 10px; border-radius: 999px;
      background: #f0fdf4; color: #166534;
      border: 1px solid #bbf7d0; font-size: 11px; font-weight: 700;
    }
    .approve-btn {
      padding: 12px 36px; border: none; border-radius: 10px;
      background: linear-gradient(90deg, #059669, #047857);
      color: white; font-weight: 700; font-size: 15px;
      box-shadow: 0 8px 24px rgba(5,150,105,0.18);
      cursor: pointer; transition: opacity .15s;
    }
    .approve-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .nav-item {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 8px; color: #333;
      text-decoration: none; font-weight: 600; font-size: 14px;
      border: 1px solid #e2e8f0; background: white;
    }
    .nav-item:hover { background: var(--lv-indigo); color: white; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #c7d2fe;
      border-top-color: var(--lv-indigo);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      text-align: center; padding: 18px;
      color: #6b6b80; font-size: 13px; margin-top: 26px;
    }
  </style>
</head>
<body>

  <div class="top">
    <a href="dashboard.html" class="logo">LD</a>
    <div class="brand">
      <div class="title">Livision DataHub</div>
      <div class="sub">Empowering smarter data</div>
    </div>
  </div>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="title">Approval Review</div>
        <div class="sub">Review schema and binary mappings before approving.</div>
      </div>
      <a class="nav-item" href="dashboard.html">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
      </a>
    </div>

    <!-- DB ID chip -->
    <div class="schema-chip">
      <i class="fa-solid fa-database"></i>
      <span id="dbIdChip">db_id: --</span>
    </div>

    <!-- Schema Section -->
    <div class="page-card">
      <h5><i class="fa-solid fa-diagram-project"></i> Schema Explorer</h5>
      <div class="status-panel" id="schemaStatus">
        <span class="spinner"></span> Loading schema...
      </div>
      <div id="schemaMount"></div>
    </div>

    <!-- Binary Columns Section -->
    <div class="page-card">
      <h5><i class="fa-solid fa-table-columns"></i> Binary Column Mappings</h5>
      <div class="status-panel" id="binaryStatus">
        <span class="spinner"></span> Loading binary mappings...
      </div>
      <div id="binaryMount"></div>
    </div>

    <!-- Approve -->
    <div style="text-align:right; margin-top:8px;">
      <button class="approve-btn" id="approveBtn" disabled>
        <i class="fa-solid fa-check" style="margin-right:8px;"></i>Approve
      </button>
    </div>
  </main>

  <footer>© 2025 Livision DataHub — Empowering smarter decisions</footer>

  <script>
    const SCHEMA_API_URL = 'https://dpm44skvaxno5gkzadi3kpodyu0vfzct.lambda-url.ap-south-1.on.aws';
    const BINARY_API_URL = 'https://zw2ahet7yyteveqhv53euau5ym0obgpj.lambda-url.ap-south-1.on.aws';

    const params = new URLSearchParams(window.location.search);
    const dbId = (params.get('db_id') || params.get('db') || '').trim();

    const dbIdChip     = document.getElementById('dbIdChip');
    const schemaStatus = document.getElementById('schemaStatus');
    const schemaMount  = document.getElementById('schemaMount');
    const binaryStatus = document.getElementById('binaryStatus');
    const binaryMount  = document.getElementById('binaryMount');
    const approveBtn   = document.getElementById('approveBtn');

    dbIdChip.textContent = 'db_id: ' + (dbId || '--');

   if (!dbId) {
  schemaStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#dc2626"></i> No db_id found in URL.';
  binaryStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#dc2626"></i> No db_id found in URL.';
} else {

    let schemaLoaded = false;
    let binaryLoaded = false;

    function checkAllLoaded() {
      if (schemaLoaded && binaryLoaded) approveBtn.disabled = false;
    }

    // ── Parse table counts helper ──────────────────────────────────────────
    function parseAndInjectCounts(raw, mount) {
      if (!raw) return;
      try {
        const cleaned = raw
          .replace(/'/g, '"').replace(/\(/g, '[').replace(/\)/g, ']')
          .replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false');
        const counts = (JSON.parse(cleaned).table_counts || []);
        const countMap    = new Map();
        const schemaTotals = new Map();
        counts.forEach(function(e) {
          if (!Array.isArray(e) || !e[0]) return;
          const key   = String(e[0]);
          const count = Number(e[1]) || 0;
          countMap.set(key, count);
          const schema = key.split('.')[0];
          schemaTotals.set(schema, (schemaTotals.get(schema) || 0) + count);
        });
        countMap.forEach(function(count, key) {
          const el = mount.querySelector('[id="' + key + '_c"]');
          if (el) el.textContent = ' ' + count.toLocaleString();
        });
        schemaTotals.forEach(function(total, schema) {
          const el = mount.querySelector('[id="' + schema + '_c"]');
          if (el) el.textContent = ' ' + total.toLocaleString();
        });
      } catch(e) {
        console.warn('Failed to inject counts:', e);
      }
    }

    // ── 1. Schema API ──────────────────────────────────────────────────────
    fetch(SCHEMA_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ db_id: dbId })
    })
    .then(r => r.text())
    .then(function(html) {
      schemaStatus.style.display = 'none';
      schemaMount.innerHTML = html;

      // Re-run injected scripts
      schemaMount.querySelectorAll('script').forEach(function(old) {
        const s = document.createElement('script');
        s.textContent = old.textContent;
        document.body.appendChild(s);
        document.body.removeChild(s);
      });

      schemaLoaded = true;
      checkAllLoaded();
    })
    .catch(function(err) {
      console.error('Schema API error:', err);
      schemaStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#dc2626"></i> Failed to load schema.';
    });

    // ── 2. Binary API ──────────────────────────────────────────────────────
    fetch(BINARY_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ db_id: dbId })
    })
  
    .then(r => r.json())
    .then(function(data) {
  binaryStatus.style.display = 'none';

  const binCols = data.bin_cols || [];

  if (!binCols.length) {
    binaryMount.innerHTML = '<p style="color:#94a3b8;font-size:13px;">No binary columns found for this database.</p>';
    binaryLoaded = true;
    checkAllLoaded();
    return;
  }

  let rowsHtml = '';
  binCols.forEach(function(col) {
    rowsHtml += `
      <tr>
        <td>${col.schema || '—'}.${col.table || '—'}</td>
        <td>${col.column_name || '—'}</td>
        <td>${col.binary_type || '—'}</td>
        <td><span class="badge-green">${col.mapping_column || '—'}</span></td>
      </tr>`;
  });

  binaryMount.innerHTML = `
    <div style="border:1px solid rgba(120,110,220,0.15);border-radius:12px;overflow:hidden;">
      <table class="binary-table">
        <thead>
          <tr>
            <th>Table</th>
            <th>Binary Column</th>
            <th>Type</th>
            <th>Mapped To</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;

  binaryLoaded = true;
  checkAllLoaded();
})
    .catch(function(err) {
      console.error('Binary API error:', err);
      binaryStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#dc2626"></i> Failed to load binary mappings.';
    });

    // ── Approve button ─────────────────────────────────────────────────────
    approveBtn.addEventListener('click', function() {
      approveBtn.disabled = true;
      approveBtn.innerHTML = '<i class="fa-solid fa-circle-check" style="margin-right:8px;"></i>Approved';
      approveBtn.style.background = '#94a3b8';
      // TODO: call your approve Lambda here when ready
    });
}
  </script>
</body>
</html>
