<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livision DataHub — Migration Status</title>
    <link rel="icon" type="image/x-icon" href="ld.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="js/jquery-3.7.1.min.js"></script>
    <style>
      :root {
        --lv-purple-1: #b29cff;
        --lv-purple-2: #7c63ff;
        --lv-indigo: #5b3ed6;
        --muted: #6b6b80;
        --glass: rgba(255, 255, 255, 0.86);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        background:
          radial-gradient(
            1000px 400px at 10% 10%,
            rgba(123, 97, 255, 0.06),
            transparent
          ),
          linear-gradient(120deg, #eef0ff, #fbf8ff);
        color: #172033;
        padding-bottom: 80px;
        -webkit-font-smoothing: antialiased;
      }

      .top {
        height: 72px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 26px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.92),
          rgba(250, 246, 255, 0.92)
        );
        border-bottom: 1px solid rgba(120, 110, 220, 0.06);
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(6px);
      }

      .top .logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          var(--lv-purple-1),
          var(--lv-indigo)
        );
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }

      .top .brand .title {
        font-size: 18px;
        font-weight: 800;
        color: var(--lv-indigo);
      }

      .top .brand .sub {
        font-size: 13px;
        color: var(--muted);
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 72px;
        bottom: 0;
        width: 280px;
        padding: 22px 20px;
        background: var(--glass);
        border-right: 1px solid rgba(120, 110, 220, 0.06);
        box-shadow: 0 12px 40px rgba(91, 62, 214, 0.04);
        backdrop-filter: blur(6px);
      }

      .brand-sidebar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .brand-sidebar .logo-panel {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          var(--lv-purple-1),
          var(--lv-indigo)
        );
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
      }

      .brand-sidebar h4 {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
        color: #172033;
      }

      .brand-sidebar small {
        color: var(--muted);
      }

      .nav-section {
        margin-top: 12px;
        display: block;
        font-weight: 700;
        color: #172033;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        color: #333;
        text-decoration: none;
        margin-bottom: 6px;
        transition: all 0.12s ease;
        font-weight: 600;
      }

      .nav-item i {
        width: 20px;
        text-align: center;
        color: var(--lv-indigo);
      }

      .nav-item:hover,
      .nav-item.active {
        background: linear-gradient(
          90deg,
          var(--lv-purple-1),
          var(--lv-indigo)
        );
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 8px 26px rgba(91, 62, 214, 0.08);
      }

      .nav-item:hover i,
      .nav-item.active i {
        color: white;
      }

      .main {
        margin-left: 320px;
        padding: 22px 34px 140px 34px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--glass);
        padding: 12px 18px;
        border-radius: 12px;
        border: 1px solid rgba(120, 110, 220, 0.06);
      }

      .topbar .title {
        font-size: 18px;
        font-weight: 700;
        color: var(--lv-indigo);
      }

      .topbar .sub {
        font-size: 13px;
        color: var(--muted);
      }

      .page-card {
        margin-top: 18px;
        background: #fdfbff; /* Changed to a very light purple-white */
        border: 1px solid rgba(120, 110, 220, 0.08);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 40px rgba(91, 62, 214, 0.05);
      }

      .status-panel {
        margin-bottom: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        background: linear-gradient(
          90deg,
          rgba(124, 99, 255, 0.08),
          rgba(255, 154, 177, 0.08)
        );
        color: #334155;
        font-weight: 600;
      }

      /* Schema Explorer UI Replica Styles */
      .node {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        margin-top: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 700;
        color: #172033;
      }

      .node:hover {
        background: #f1f5f9;
        transform: translateX(4px);
      }

      .node.active {
        border-color: var(--lv-purple-2);
        background: white;
        box-shadow: 0 4px 12px rgba(124, 99, 255, 0.08);
      }

      .node .arrow {
        transition: transform 0.2s ease;
        color: var(--muted);
        font-size: 12px;
      }

      .node.active .arrow {
        transform: rotate(180deg);
      }

      .schema-node {
        border-left: 4px solid var(--lv-indigo);
      }

      .table-node {
        margin-left: 20px;
        background: #eef2ff; /* Changed to a slightly more distinct light blue */
      }

      #migrationResponse {
        margin: 0;
      }

      .panel {
        overflow: hidden;
      }

      /* Styles for the migration table, similar to schema explorer */
      .migration-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }

      .migration-table th,
      .migration-table td {
        padding: 10px 12px;
        text-align: left;
        border: 1px solid #e2e8f0; /* Light gray border */
        font-size: 13px;
        color: #334155;
        vertical-align: top;
      }

      .migration-table th {
        background-color: #fefce8;
        font-weight: 700;
        color: #5b21b6;
        position: sticky;
        top: 0;
        z-index: 1;
        border-bottom: 1px solid #ede9fe;
      }

      .migration-table tbody tr:nth-child(even) {
        background-color: #fcfcfc; /* Zebra striping */
      }

      .migration-table tbody tr:hover {
        background-color: #f0f4ff; /* Hover effect */
      }

      .status-success {
        color: #16a34a; /* Green for success */
        font-weight: 600;
      }

      .status-error {
        color: #dc2626; /* Red for error */
        font-weight: 600;
      }

      .status-inprogress {
        color: #f59e0b; /* Orange for in progress */
        font-weight: 600;
      }

      /* Panel-like container for the table, to match page-card styling */
      .panel {
        width: 100%;
        overflow-x: auto;
        padding: 0; /* Remove padding here, it's handled by page-card */
        box-sizing: border-box;
        background: transparent; /* Transparent as it's inside page-card */
        border-radius: 0;
        box-shadow: none;
      }

      /* Adjust page-card padding to accommodate inner panel */
      .page-card {
        padding: 22px; /* Restored padding for the page card */
      }

      footer {
        position: fixed;
        left: 320px;
        right: 0;
        bottom: 0;
        height: 72px;
        background: linear-gradient(180deg, #fff, #fbfbff);
        border-top: 1px solid rgba(120, 110, 220, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 13px;
        box-shadow: 0 -6px 20px rgba(91, 62, 214, 0.02);
      }

      @media (max-width: 980px) {
        .sidebar {
          position: static;
          width: auto;
          margin: 16px;
          border-radius: 18px;
        }
        .main {
          margin-left: 0;
          padding: 16px;
        }
        footer {
          left: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="top">
      <a href="dashboard.html" title="Dashboard" class="logo">LD</a>
      <div class="brand">
        <div class="title">Livision DataHub</div>
        <div class="sub">Empowering smarter data</div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="brand-sidebar">
        <div class="logo-panel">
          <img
            src="ld.png"
            alt="Livision logo"
            style="
              width: 100%;
              height: 100%;
              object-fit: cover;
              border-radius: 12px;
            "
          />
        </div>
        <div>
          <h4>Livision DataHub</h4>
          <small>Empowering smarter data</small>
        </div>
      </div>

      <span class="nav-section">Workspace</span>
      <a class="nav-item" href="dashboard.html">
        <i class="fa-solid fa-table-columns"></i>
        <span>Dashboard</span>
      </a>
      <a class="nav-item active" href="migration-status.html">
        <i class="fa-solid fa-rocket"></i>
        <span>Migration Status</span>
      </a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <div class="title">Migration Status</div>
          <div class="sub">
            View the current progress of your database migration.
          </div>
        </div>
        <a class="nav-item" href="dashboard.html" style="margin: 0">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Dashboard</span>
        </a>
      </div>

      <section class="page-card">
        <div class="status-panel" id="migrationLoading">
          <i class="fa-solid fa-spinner fa-spin me-2"></i> Loading Migration
          Status...
        </div>
        <!-- The migration table will be injected here -->
        <!-- The .panel class is added by JS to the table wrapper -->
        <div id="migrationResponse"></div>
      </section>
    </main>

    <footer>© 2025 Livision DataHub — Empowering smarter decisions</footer>
    <script src="js/migration-status.js"></script>
  </body>
</html>
