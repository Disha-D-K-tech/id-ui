<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livision DataHub — Binary Explorer</title>
  <link rel="icon" type="image/x-icon" href="ld.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --lv-purple-1: #b29cff;
      --lv-purple-2: #7c63ff;
      --lv-indigo: #5b3ed6;
      --muted: #6b6b80;
      --glass: rgba(255, 255, 255, 0.86);
      --accent-1: #7c3aed;
      --accent-2: #ff9ab1;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    body {
      background: radial-gradient(1000px 400px at 10% 10%, rgba(123, 97, 255, 0.06), transparent),
        linear-gradient(120deg, #eef0ff, #fbf8ff);
      color: #172033;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    .top {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 26px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.92), rgba(250, 246, 255, 0.92));
      border-bottom: 1px solid rgba(120, 110, 220, 0.06);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(6px);
    }

    .top .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--lv-purple-1), var(--lv-indigo));
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    .top .brand .title {
      font-size: 18px;
      font-weight: 800;
      color: var(--lv-indigo);
    }

    .top .brand .sub {
      font-size: 13px;
      color: var(--muted);
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 72px;
      bottom: 0;
      width: 280px;
      padding: 22px 20px;
      background: var(--glass);
      border-right: 1px solid rgba(120, 110, 220, 0.06);
      box-shadow: 0 12px 40px rgba(91, 62, 214, 0.04);
      backdrop-filter: blur(6px);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand .logo-panel {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--lv-purple-1), var(--lv-indigo));
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
    }

    .brand h4 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #172033;
    }

    .brand small {
      color: var(--muted);
    }

    .nav-section {
      margin-top: 12px;
      display: block;
      font-weight: 700;
      color: #172033;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #333;
      text-decoration: none;
      margin-bottom: 6px;
      transition: all .12s ease;
      font-weight: 600;
    }

    .nav-item i {
      width: 20px;
      text-align: center;
      color: var(--lv-indigo);
    }

    .nav-item:hover,
    .nav-item.active {
      background: linear-gradient(90deg, var(--lv-purple-1), var(--lv-indigo));
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(91, 62, 214, 0.08);
    }

    .nav-item:hover i,
    .nav-item.active i {
      color: white;
    }

    .main {
      margin-left: 320px;
      padding: 22px 34px 140px 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--glass);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(120, 110, 220, 0.06);
    }

    .topbar .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--lv-indigo);
    }

    .topbar .sub {
      font-size: 13px;
      color: var(--muted);
    }

    .page-card {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(120, 110, 220, 0.08);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(91, 62, 214, 0.05);
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .schema-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
      font-size: 12px;
      font-weight: 700;
    }

    .status-panel {
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(124, 99, 255, 0.08), rgba(255, 154, 177, 0.08));
      color: #334155;
      font-weight: 600;
    }

    .response-card {
      background: #0f172a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .response-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      color: #e2e8f0;
    }

    .response-head h5 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .response-head small {
      color: #94a3b8;
    }

    .response-output {
      margin: 0;
      padding: 18px;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
      min-height: 320px;
    }

    footer {
      text-align: center;
      padding: 18px;
      color: #6b6b80;
      font-size: 13px;
      margin-top: 26px;
    }

    @media (max-width: 980px) {
      .sidebar {
        position: static;
        width: auto;
        margin: 16px;
        border-radius: 18px;
      }

      .main {
        margin-left: 0;
        padding: 16px;
      }
    }

    .node {
      cursor: pointer;
      padding: 10px 16px;
      margin-top: 6px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #d0d9ff;
      border: 1px solid #a0baff;
      color: #001f3f;
      user-select: none;
    }

    .node.active {
      background: #a0baff;
    }

    .panel {
      display: none;
      margin: 0 0 6px 0;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-top: none;
      border-radius: 0 0 8px 8px;
      background: #fff;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .controls button {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: var(--lv-indigo);
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .controls button:hover {
      background: var(--lv-purple-2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
      background: white;
    }

    th,
    td {
      border: 1px solid #eee;
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f3f0ff;
      font-weight: 700;
      color: var(--lv-indigo);
    }

    tr:nth-child(even) {
      background-color: #f8f6ff;
    }

    tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .form-select {
      border: 1px solid #e5defa;
      border-radius: 6px;
      font-size: 13px;
      padding: 4px 8px;
    }
  </style>
</head>

<body>
  <div class="top">
    <a href="dashboard.html" title="Dashboard" class="logo">LD</a>
    <div class="brand">
      <div class="title">Livision DataHub</div>
      <div class="sub">Empowering smarter data</div>
    </div>
  </div>

  <aside class="sidebar" role="navigation" aria-label="Main sidebar">
    <div class="brand">
      <div class="logo-panel">
        <img src="ld.png" alt="Livision logo" style="width:100%;height:100%;object-fit:cover;border-radius:12px" />
      </div>
      <div>
        <h4>Livision DataHub</h4>
        <small>Empowering smarter data</small>
      </div>
    </div>

    <span class="nav-section">Workspace</span>
    <a class="nav-item" href="dashboard.html">
      <i class="fa-solid fa-table-columns"></i>
      <span>Dashboard</span>
    </a>
    <a class="nav-item active" href="binary_explorer.html">
      <i class="fa-solid fa-file-binary"></i>
      <span>Binary Explorer</span>
    </a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="title">Binary Explorer</div>
        <div class="sub">View binary column mappings.</div>
      </div>
      <a class="nav-item" href="dashboard.html" style="margin:0">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Dashboard</span>
      </a>
    </div>

    <section class="page-card">
      <div class="page-actions">
        <div class="schema-chip">
          <i class="fa-solid fa-database"></i>
          <span id="dbIdChip">db_id: --</span>
        </div>
        <div class="schema-chip">
          <i class="fa-regular fa-clock"></i>
          <span id="schemaFetchedAt">Fetched: --</span>
        </div>
      </div>
      <div class="status-panel" id="schemaStatus">Preparing stored assessment data...</div>
      <div id="schemaHtmlMount"></div>
      
      <div class="text-end mt-4" style="display:flex;justify-content:flex-end;gap:12px;">
        <button id="saveMappingBtn" style="padding: 10px 28px; border: none; border-radius: 8px; background: linear-gradient(90deg, var(--lv-purple-1), var(--lv-indigo)); color: white; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(91, 62, 214, 0.15); cursor: pointer;">
          <i class="fa-solid fa-floppy-disk me-2"></i>Save
        </button>
        <button id="sendApprovalBtn" style="display: none; padding: 10px 28px; border: none; border-radius: 8px; background: linear-gradient(90deg, #059669, #047857); color: white; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(5,150,105,0.15); cursor: pointer;">
          <i class="fa-solid fa-paper-plane me-2"></i>Send for Approval
        </button>
      </div>
    </section>

  </main>

  <footer>© 2025 Livision DataHub — Empowering smarter decisions</footer>

  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/binary_explorer.js"></script>

</html>
